[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grounded-mcp"
version = "0.1.0"
description = "An evals-first MCP server for markdown knowledge vaults: citations, abstention, entitlements — with the eval suite to prove them."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Richard Atkins" }]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "knowledge-base", "obsidian", "rag", "evals"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
grounded-mcp = "grounded_mcp.server:main"

[project.urls]
Homepage = "https://github.com/rich-atkins/grounded-mcp"
Issues = "https://github.com/rich-atkins/grounded-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/grounded_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
